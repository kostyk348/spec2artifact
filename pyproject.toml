[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spec2artifact"
version = "0.1.0"
description = "LLM writes a small variant spec; the algebra renders the artifact (fewer tokens, less latency)"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
spec2artifact = "spec2artifact.cli:main"
